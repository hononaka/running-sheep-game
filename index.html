<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Running Sheep</title>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1e;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #7ec0ee;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.45);
            border-radius: 8px;
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            touch-action: none;
        }
        @media (min-width: 769px) {
            canvas {
                width: min(100vw, 160vh);
                height: auto;
                max-height: 80vh;
            }
        }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400" tabindex="0"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const MOBILE_LAYOUT = window.matchMedia('(max-width: 768px)').matches ||
    'ontouchstart' in window;
const GROUND_Y = MOBILE_LAYOUT ? 315 : 340;
const CLEAR_GOAL = 50;
const MAX_LIVES = 2;
const MAX_SCORE = 100;
const HAY_POINTS = 10;
const CROW_POINTS = 5;
const HIT_PENALTY = 5;
const FLYING_CROW_SPEED_MULTIPLIER = 1.45;
const SHEEP_GROUND_Y = GROUND_Y - 46;

let gameState = 'START';
let lives = 1; // Hay can increase lives up to the maximum.
let score = 0;
let passedObstacles = 0;
let backgroundProgress = 0;
let gameSpeed = 6.2;
let frame = 0;
let invincibleUntil = 0;
let obstacleTimer = 0;
let nextObstacleInterval = 30;
let pitTimer = 0;
let nextPitInterval = 95;
let hayTimer = 0;
let nextHayInterval = 140;
let obstacles = [];
let pits = [];
let hays = [];
let paperScraps = [];
let clouds = [];
let hills = [];
let particles = [];
let clearAnim = 0;
let gameOverAnim = 0;
let lastHitId = null;
let rankingSaved = false;
let audioContext = null;
let musicTimer = null;
let goalMusicTimer = null;
let orientationNotice = false;
let deathPit = null;

for (let i = 0; i < 5; i++) {
    clouds.push({
        x: Math.random() * 800,
        y: 30 + Math.random() * 80,
        s: 0.4 + Math.random() * 0.5,
        w: 50 + Math.random() * 40
    });
}
let hillX = 0;
for (let i = 0; i < 7; i++) {
    hillX += 250 + Math.random() * 100;
    hills.push({
        x: hillX,
        w: 180 + Math.random() * 100,
        h: 52 + Math.random() * 42
    });
}

const sheep = {
    x: 110,
    y: SHEEP_GROUND_Y,
    width: 52,
    height: 46,
    vy: 0,
    gravity: 1.08,
    jumpPower: -13.5,
    isJumping: false,
    jumpCount: 0,
    facing: 1,

    hitbox() {
        return {
            x: this.x + 8,
            y: this.y + 8,
            width: this.width - 16,
            height: this.height - 10
        };
    },

    update() {
        this.vy += this.gravity;
        this.y += this.vy;
        if (this.y >= SHEEP_GROUND_Y) {
            this.y = SHEEP_GROUND_Y;
            this.vy = 0;
            this.isJumping = false;
            this.jumpCount = 0;
        }
    },

    jump() {
        if (this.jumpCount < 2) {
            this.vy = this.jumpPower;
            this.isJumping = true;
            this.jumpCount++;
            playEffect(440, 0.12, 'sine', 0.08);
        }
    }
};

function resetGame() {
    stopGoalMusic();
    sheep.y = SHEEP_GROUND_Y;
    sheep.vy = 0;
    sheep.isJumping = false;
    sheep.jumpCount = 0;
    lives = 1;
    score = 0;
    passedObstacles = 0;
    backgroundProgress = 0;
    gameSpeed = 7.2;
    frame = 0;
    invincibleUntil = 0;
    obstacleTimer = 0;
    nextObstacleInterval = 30;
    pitTimer = 0;
    nextPitInterval = 95;
    hayTimer = 0;
    nextHayInterval = 140;
    obstacles = [];
    pits = [];
    hays = [];
    paperScraps = [];
    particles = [];
    clearAnim = 0;
    gameOverAnim = 0;
    lastHitId = null;
    rankingSaved = false;
    deathPit = null;
}

function rectsOverlap(a, b, margin = 0) {
    return (
        a.x + margin < b.x + b.width &&
        a.x + a.width - margin > b.x &&
        a.y + margin < b.y + b.height &&
        a.y + a.height - margin > b.y
    );
}

function spawnObstacle() {
    if (passedObstacles >= CLEAR_GOAL) return false;
    const last = obstacles[obstacles.length - 1];
    if (last && last.x > canvas.width - 320) return false;
    const isCrow = Math.random() < 0.62;
    if (isCrow) {
        const flying = Math.random() < 0.95;
        obstacles.push({
            id: frame + Math.random(),
            type: 'crow',
            x: canvas.width + 20,
            y: 215 + Math.random() * (GROUND_Y - 48 - 215),
            width: 38,
            height: 24,
            wing: 0,
            flying,
            direction: flying ? -1 : 0,
            counted: false
        });
    } else {
        obstacles.push({
            id: frame + Math.random(),
            type: 'fence',
            x: canvas.width + 10 + Math.random() * 28,
            y: GROUND_Y - 48,
            width: 28,
            height: 48,
            counted: false
        });
    }
    return true;
}

function spawnHay() {
    const inAir = Math.random() < 0.5;
    const hay = {
        id: frame + Math.random(),
        x: canvas.width + 16,
        y: inAir ? 220 + Math.random() * 30 : GROUND_Y - 28,
        width: 26,
        height: 18,
        inAir
    };
    const tooClose = obstacles.some((o) => Math.abs(o.x - hay.x) < 90);
    if (!tooClose) hays.push(hay);
}

function spawnPaperScrap() {
    const scrap = {
        id: frame + Math.random(),
        x: canvas.width + 16,
        y: Math.random() < 0.5 ? 175 + Math.random() * 50 : GROUND_Y - 28,
        width: 24,
        height: 19,
        rotation: -0.25 + Math.random() * 0.5
    };
    const tooClose = obstacles.some((o) => Math.abs(o.x - scrap.x) < 90) ||
        hays.some((h) => Math.abs(h.x - scrap.x) < 70);
    if (!tooClose) paperScraps.push(scrap);
}

function changeScore(amount) {
    score = Math.max(0, score + amount);
}

function loseLife(obstacleId, scorePenalty = HIT_PENALTY) {
    if (frame < invincibleUntil) return;
    if (lastHitId === obstacleId) return;
    lastHitId = obstacleId;
    lives -= 1;
    changeScore(-scorePenalty);
    playDamageSound();
    invincibleUntil = frame + 50;
    burst(sheep.x + 20, sheep.y + 16, '#fff');
    if (lives <= 0) {
        lives = 0;
        gameState = 'GAME_OVER';
        gameOverAnim = 0;
        sheep.vy = -2.5;
        stopMusic();
    }
}

function countPassedObstacle() {
    passedObstacles++;
    if (passedObstacles >= CLEAR_GOAL) {
        gameState = 'CLEAR';
        clearAnim = 0;
        obstacles = [];
        pits = [];
        hays = [];
        paperScraps = [];
        saveScoreRanking(score);
        playSleepSound();
        stopMusic();
        startGoalMusic();
    }
}

function playEffect(frequency, duration, type = 'sine', volume = 0.08) {
    if (!audioContext) return;
    if (audioContext.state === 'suspended') audioContext.resume();
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
    gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(volume, audioContext.currentTime + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration + 0.02);
}

function playCrowStompSound() {
    playEffect(520, 0.12, 'sine', 0.07);
    window.setTimeout(() => playEffect(380, 0.16, 'sine', 0.055), 70);
}

function playDamageSound() {
    playEffect(105, 0.16, 'square', 0.07);
    window.setTimeout(() => playEffect(72, 0.2, 'square', 0.055), 65);
}

function playSleepSound() {
    if (!ensureAudio()) return;
    playEffect(196, 0.35, 'sine', 0.045);
    window.setTimeout(() => playEffect(146.83, 0.45, 'sine', 0.035), 320);
    window.setTimeout(() => playEffect(110, 0.7, 'sine', 0.025), 760);
}

function startGoalMusic() {
    if (goalMusicTimer || !ensureAudio()) return;
    const notes = [392, 523.25, 659.25, 523.25, 440, 587.33, 698.46, 587.33];
    let noteIndex = 0;
    const playNote = () => {
        if (!audioContext || gameState !== 'CLEAR') return;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = notes[noteIndex++ % notes.length];
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.035, audioContext.currentTime + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.75);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.8);
    };
    playNote();
    goalMusicTimer = window.setInterval(playNote, 820);
}

function stopGoalMusic() {
    if (goalMusicTimer) {
        window.clearInterval(goalMusicTimer);
        goalMusicTimer = null;
    }
}

function ensureAudio() {
    if (!audioContext) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return false;
        audioContext = new AudioContext();
    }
    if (audioContext.state === 'suspended') audioContext.resume();
    return true;
}

function saveScoreRanking(value) {
    if (rankingSaved) return;
    rankingSaved = true;
    let scores = [];
    try {
        scores = JSON.parse(localStorage.getItem('runningSheepScores') || '[]');
        if (!Array.isArray(scores)) scores = [];
    } catch (error) {
        scores = [];
    }
    scores.push({ score: value, date: Date.now() });
    scores.sort((a, b) => b.score - a.score || b.date - a.date);
    try {
        localStorage.setItem('runningSheepScores', JSON.stringify(scores.slice(0, 5)));
    } catch (error) {
        // Ranking remains visible for the current result even if storage is unavailable.
    }
}

function getScoreRanking() {
    try {
        const scores = JSON.parse(localStorage.getItem('runningSheepScores') || '[]');
        return Array.isArray(scores) ? scores.slice(0, 5) : [];
    } catch (error) {
        return [];
    }
}

function burst(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 3.5,
            vy: -Math.random() * 2.5 - 0.4,
            life: 28,
            color
        });
    }

}

function requestLandscape() {
    if (!screen.orientation || !screen.orientation.lock) return;
    screen.orientation.lock('landscape').catch(() => {
        orientationNotice = true;
    });
}

window.addEventListener('keydown', (e) => {
    if (e.code !== 'Enter') return;
    e.preventDefault();
    if (gameState === 'CLEAR' && clearAnim < 120) return;
    if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'CLEAR') {
        resetGame();
        gameState = 'PLAYING';
        requestLandscape();
        startMusic();
    } else if (gameState === 'PLAYING') {
        sheep.jump();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (gameState === 'CLEAR' && clearAnim < 120) return;
    if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'CLEAR') {
        resetGame();
        gameState = 'PLAYING';
        requestLandscape();
        startMusic();
    } else if (gameState === 'PLAYING') {
        sheep.jump();
    }
}, { passive: false });

function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    const progress = backgroundProgress;
    const eveningProgress = smoothstep(progress);
    const top = mix('#7ec0ee', '#f29a70', eveningProgress);
    const bottom = mix('#c9e8ff', '#ffd39a', eveningProgress);
    g.addColorStop(0, top);
    g.addColorStop(1, bottom);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'CLEAR') {
        const nightProgress = smoothstep(Math.max(0, (clearAnim - 90) / 150));
        ctx.fillStyle = `rgba(7, 21, 47, ${nightProgress * 0.82})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < 42; i++) {
            const x = (i * 137) % canvas.width;
            const y = 18 + (i * 47) % (GROUND_Y - 55);
            const twinkle = nightProgress * (0.55 + Math.sin(clearAnim * 0.06 + i) * 0.25);
            ctx.fillStyle = `rgba(255, 250, 210, ${twinkle})`;
            ctx.beginPath();
            ctx.arc(x, y, 1 + (i % 3) * 0.45, 0, Math.PI * 2);
            ctx.fill();
        }
    }
}

function mix(a, b, t) {
    const pa = hexToRgb(a);
    const pb = hexToRgb(b);
    const r = Math.round(pa.r + (pb.r - pa.r) * t);
    const g = Math.round(pa.g + (pb.g - pa.g) * t);
    const bl = Math.round(pa.b + (pb.b - pa.b) * t);
    return `rgb(${r},${g},${bl})`;
}

function smoothstep(t) {
    const clamped = Math.max(0, Math.min(1, t));
    return clamped * clamped * (3 - 2 * clamped);
}

function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function drawBackground() {
    const scroll = gameState === 'PLAYING' ? frame * gameSpeed * 0.15 : 0;
    const hillWorldWidth = 2400;
    hills.forEach((h, i) => {
        const x = ((h.x - scroll * (0.35 + i * 0.02)) % hillWorldWidth + hillWorldWidth) % hillWorldWidth - 100;
        [-hillWorldWidth, 0, hillWorldWidth].forEach((offset) => {
            const hillX = x + offset;
            ctx.fillStyle = i % 2 === 0 ? '#6aa84f' : '#5c9a45';
            ctx.beginPath();
            ctx.ellipse(hillX + h.w / 2, GROUND_Y + 10, h.w / 2, h.h, 0, Math.PI, 0);
            ctx.fill();
        });
    });

    clouds.forEach((c) => {
        if (gameState === 'PLAYING') c.x -= c.s;
        if (c.x < -90) c.x = canvas.width + 40;
        if (gameState !== 'CLEAR') drawCloud(c.x, c.y, c.w);
    });

    ctx.fillStyle = '#6d9e3e';
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(0, GROUND_Y, canvas.width, 8);

    const stripe = gameState === 'PLAYING' ? (frame * gameSpeed) % 40 : 0;
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    for (let x = -stripe; x < canvas.width; x += 40) {
        ctx.fillRect(x, GROUND_Y + 18, 18, 4);
    }
}

function drawCloud(x, y, w) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(x, y, w * 0.28, 0, Math.PI * 2);
    ctx.arc(x + w * 0.28, y - 6, w * 0.32, 0, Math.PI * 2);
    ctx.arc(x + w * 0.55, y, w * 0.26, 0, Math.PI * 2);
    ctx.fill();
}

function drawFence(o) {
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(o.x + 4, o.y, 6, o.height);
    ctx.fillRect(o.x + 18, o.y, 6, o.height);
    ctx.fillStyle = '#a36a34';
    ctx.fillRect(o.x, o.y + 8, 28, 6);
    ctx.fillRect(o.x, o.y + 22, 28, 6);
    ctx.fillStyle = '#6e4320';
    ctx.fillRect(o.x + 2, o.y + 8, 24, 2);
}

function drawPit(pit) {
    ctx.fillStyle = '#3a2418';
    ctx.beginPath();
    ctx.ellipse(
        pit.x + pit.width / 2,
        GROUND_Y + 2,
        pit.width / 2,
        9,
        0,
        0,
        Math.PI * 2
    );
    ctx.fill();
    ctx.strokeStyle = '#6d4c35';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(pit.x + pit.width / 2, GROUND_Y + 2, pit.width / 2 - 3, 0, Math.PI);
    ctx.stroke();
}

function drawCrow(o) {
    o.wing = o.flying ? Math.sin(frame * 0.35) * 8 : 0;
    ctx.save();
    ctx.translate(o.x + 19, o.y);
    ctx.scale(o.direction === 1 ? 1 : -1, 1);
    const x = -19;
    const y = 0;
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.ellipse(x + 18, y + 14, 16, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 18, y + 12);
    ctx.quadraticCurveTo(x + 8, y + 4 + o.wing, x - 4, y + 10);
    ctx.quadraticCurveTo(x + 10, y + 10, x + 18, y + 14);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + 18, y + 12);
    ctx.quadraticCurveTo(x + 30, y + 2 - o.wing, x + 42, y + 8);
    ctx.quadraticCurveTo(x + 28, y + 12, x + 20, y + 14);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(x + 30, y + 12, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f4a261';
    ctx.beginPath();
    ctx.moveTo(x + 34, y + 12);
    ctx.lineTo(x + 42, y + 14);
    ctx.lineTo(x + 34, y + 16);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x + 31.5, y + 11, 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function drawHay(h) {
    ctx.save();
    ctx.translate(h.x + 13, h.y + 9);
    ctx.rotate(-0.15);
    ctx.fillStyle = '#e6c35c';
    ctx.fillRect(-12, -7, 24, 14);
    ctx.fillStyle = '#c9a227';
    for (let i = -10; i <= 8; i += 5) {
        ctx.fillRect(i, -7, 2, 14);
    }
    ctx.fillStyle = '#f3d56a';
    ctx.fillRect(-12, -7, 24, 3);
    ctx.restore();
}

function drawPaperScrap(s) {
    ctx.save();
    ctx.translate(s.x + s.width / 2, s.y + s.height / 2);
    ctx.rotate(s.rotation);
    ctx.fillStyle = '#f1eee5';
    ctx.strokeStyle = '#b8b1a0';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-11, -8);
    ctx.lineTo(7, -9);
    ctx.lineTo(11, 1);
    ctx.lineTo(4, 9);
    ctx.lineTo(-10, 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#d4cdbd';
    ctx.beginPath();
    ctx.moveTo(-5, -5);
    ctx.lineTo(5, -2);
    ctx.moveTo(-7, 1);
    ctx.lineTo(4, 4);
    ctx.stroke();
    ctx.restore();
}

function drawSheep(x, y, opts = {}) {
    const sleeping = opts.sleeping;
    const dead = opts.dead;
    const blink = opts.blink;
    const run = !sheep.isJumping && !sleeping ? Math.sin(frame * 0.45) : 0;
    ctx.save();
    ctx.translate(x, y);
    if (sleeping) {
        ctx.translate(26, 28);
        ctx.rotate(-1.2);
        ctx.translate(-26, -22);
    }

    if (blink && Math.floor(frame / 4) % 2 === 0) {
        ctx.globalAlpha = 0.35;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(26, 46, 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#d8d8d8';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(14, 34);
    ctx.lineTo(10, 44 + run * 3);
    ctx.moveTo(22, 34);
    ctx.lineTo(24, 44 - run * 3);
    ctx.moveTo(34, 34);
    ctx.lineTo(32, 44 + run * 2);
    ctx.moveTo(42, 34);
    ctx.lineTo(46, 44 - run * 2);
    ctx.stroke();

    ctx.fillStyle = '#f7f7f7';
    wool(18, 22, 12);
    wool(30, 18, 13);
    wool(40, 24, 11);
    wool(24, 28, 12);
    ctx.fillStyle = '#ececec';
    ctx.beginPath();
    ctx.ellipse(28, 26, 18, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#3a3a3a';
    ctx.beginPath();
    ctx.ellipse(48, 22, 9, 8, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a2a2a';
    ctx.beginPath();
    ctx.ellipse(44, 16, 3.2, 4.5, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(54, 17, 3.2, 4.5, 0.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = sleeping ? '#3a3a3a' : '#fff';
    ctx.beginPath();
    ctx.ellipse(51, 21, 2.2, sleeping ? 0.6 : 2.2, 0, 0, Math.PI * 2);
    ctx.fill();
    if (!sleeping && !dead) {
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(51.4, 21, 1.1, 0, Math.PI * 2);
        ctx.fill();
    } else if (dead) {
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(48, 18);
        ctx.lineTo(54, 24);
        ctx.moveTo(54, 18);
        ctx.lineTo(48, 24);
        ctx.stroke();
    }
    ctx.fillStyle = '#f4a261';
    ctx.beginPath();
    ctx.ellipse(57, 24, 3, 2, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

function wool(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
}

function drawHearts() {
    for (let i = 0; i < MAX_LIVES; i++) {
        drawHeart(20 + i * 28, 22, i < lives);
    }
}

function drawHeart(x, y, filled) {
    ctx.beginPath();
    ctx.moveTo(x, y + 6);
    ctx.bezierCurveTo(x, y, x - 10, y, x - 10, y + 7);
    ctx.bezierCurveTo(x - 10, y + 14, x, y + 18, x, y + 22);
    ctx.bezierCurveTo(x, y + 18, x + 10, y + 14, x + 10, y + 7);
    ctx.bezierCurveTo(x + 10, y, x, y, x, y + 6);
    ctx.fillStyle = filled ? '#e53935' : 'rgba(255,255,255,0.55)';
    ctx.fill();
    ctx.strokeStyle = filled ? '#b71c1c' : 'rgba(80,40,40,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
}

function drawHud() {
    drawHearts();
    ctx.fillStyle = '#14330c';
    ctx.font = 'bold 18px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`Passed: ${passedObstacles} / ${CLEAR_GOAL}`, 78, 36);
    ctx.fillText(`Score: ${score} (Target: ${MAX_SCORE})`, 78, 60);
    ctx.textAlign = 'right';
    ctx.fillText(`Speed ${gameSpeed.toFixed(1)}`, canvas.width - 20, 36);
}

function drawOverlay(title, lines) {
    const boxW = 520;
    const boxH = 150 + lines.length * 28;
    const boxX = (canvas.width - boxW) / 2;
    const boxY = 88;
    ctx.fillStyle = 'rgba(18, 28, 42, 0.72)';
    roundRect(boxX, boxY, boxW, boxH, 16);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText(title, canvas.width / 2, boxY + 48);
    ctx.font = '17px sans-serif';
    lines.forEach((line, i) => {
        ctx.fillText(line, canvas.width / 2, boxY + 88 + i * 28);
    });
}

function drawFuton(x, y) {
    ctx.fillStyle = '#c62828';
    roundRect(x, y, 120, 22, 8);
    ctx.fill();
    ctx.fillStyle = '#ef9a9a';
    roundRect(x + 8, y - 10, 104, 18, 8);
    ctx.fill();
    ctx.fillStyle = '#fff8e7';
    roundRect(x + 78, y - 18, 36, 22, 10);
    ctx.fill();
}

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

function drawZzz(t) {
    ['z', 'Z', 'Z'].forEach((ch, i) => {
        const bounce = Math.sin(t * 0.08 + i) * 4;
        ctx.fillStyle = `rgba(255,255,255,${0.85 - i * 0.15})`;
        ctx.font = `${18 + i * 6}px serif`;
        ctx.fillText(ch, 430 + i * 16, 250 - i * 18 + bounce);
    });
}

function drawRanking() {
    const scores = getScoreRanking();
    const boxX = 535;
    const boxY = 108;
    const boxW = 235;
    const boxH = 46 + Math.max(1, scores.length) * 24;
    ctx.fillStyle = 'rgba(7, 21, 47, 0.82)';
    roundRect(boxX, boxY, boxW, boxH, 12);
    ctx.fill();
    ctx.fillStyle = '#fff8e1';
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText('Top Scores', boxX + boxW / 2, boxY + 28);
    ctx.textAlign = 'left';
    ctx.font = '15px sans-serif';
    if (scores.length === 0) {
        ctx.fillText('No scores yet', boxX + 22, boxY + 55);
        return;
    }
    scores.forEach((entry, index) => {
        ctx.fillText(`${index + 1}.  ${entry.score} points`, boxX + 22, boxY + 54 + index * 24);
    });
}

function drawAurora(t) {
    const alpha = Math.min(0.75, Math.max(0, (t - 150) / 80));
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 12;
    ctx.lineCap = 'round';
    [
        ['#7af5d1', 0, 0.8],
        ['#8aa7ff', 1, 1.4],
        ['#f09bff', 2, 2.1]
    ].forEach(([color, index, offset]) => {
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(120, 112 + index * 12);
        ctx.quadraticCurveTo(290, 30 + Math.sin(t * 0.025 + offset) * 22, 430, 112 + index * 8);
        ctx.quadraticCurveTo(590, 190 + Math.cos(t * 0.02 + offset) * 20, 760, 90 + index * 15);
        ctx.stroke();
    });
    ctx.restore();
}

function startMusic() {
    if (musicTimer) return;
    if (!ensureAudio()) return;
    const notes = [261.63, 329.63, 392, 329.63, 293.66, 349.23, 440, 349.23];
    let noteIndex = 0;
    const playNote = () => {
        if (!audioContext || gameState !== 'PLAYING') return;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.value = notes[noteIndex++ % notes.length];
        gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.045, audioContext.currentTime + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.28);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.3);
    };
    playNote();
    musicTimer = window.setInterval(playNote, 360);
}

function stopMusic() {
    if (musicTimer) {
        window.clearInterval(musicTimer);
        musicTimer = null;
    }
}

function updatePlaying() {
    frame++;
    const acceleration = gameSpeed >= 10 ? 0.0028 * (2 / 3) : 0.0028;
    gameSpeed = Math.min(15.5, gameSpeed + acceleration);
    const targetBackgroundProgress = Math.min(1, passedObstacles / CLEAR_GOAL);
    backgroundProgress += (targetBackgroundProgress - backgroundProgress) * 0.035;

    sheep.update();

    obstacleTimer++;
    if (obstacleTimer >= nextObstacleInterval) {
        if (spawnObstacle()) {
            obstacleTimer = 0;
            nextObstacleInterval = 32 + Math.floor(Math.random() * 55);
            nextObstacleInterval = Math.max(28, nextObstacleInterval - Math.floor(gameSpeed * 2));
        }
    }

    pitTimer++;
    if (pitTimer >= nextPitInterval) {
        const lastObstacle = obstacles[obstacles.length - 1];
        const pit = {
            id: frame + Math.random(),
            x: canvas.width + 20,
            y: GROUND_Y - 5,
            width: 48,
            height: 12
        };
        const tooClose = (lastObstacle && lastObstacle.x > canvas.width - 260) ||
            pits.some((existingPit) => Math.abs(existingPit.x - pit.x) < 130);
        if (!tooClose) {
            pits.push(pit);
            pitTimer = 0;
            nextPitInterval = 85 + Math.floor(Math.random() * 110);
        }
    }

    hayTimer++;
    if (hayTimer >= nextHayInterval) {
        spawnHay();
        if (Math.random() < 0.6) spawnPaperScrap();
        hayTimer = 0;
        nextHayInterval = 120 + Math.floor(Math.random() * 160);
    }

    const hb = sheep.hitbox();

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x += o.type === 'crow' && o.flying
            ? o.direction * gameSpeed * FLYING_CROW_SPEED_MULTIPLIER
            : -gameSpeed;
        const passedForward = o.type === 'crow' && o.flying && o.direction === 1
            ? o.x > sheep.x + sheep.width
            : o.x + o.width < sheep.x;
        if (!o.counted && passedForward) {
            o.counted = true;
            countPassedObstacle();
        }
        const footBox = {
            x: sheep.x + 8,
            y: sheep.y + sheep.height - 12,
            width: sheep.width - 16,
            height: 12
        };
        const isCrowStomp = o.type === 'crow' &&
            sheep.vy > 0 &&
            footBox.y + footBox.height >= o.y &&
            footBox.y < o.y + o.height &&
            rectsOverlap(footBox, o, 2);
        if (isCrowStomp) {
            changeScore(CROW_POINTS);
            playCrowStompSound();
            if (!o.counted) {
                o.counted = true;
                countPassedObstacle();
            }
            sheep.vy = sheep.jumpPower * 0.7;
            burst(o.x + o.width / 2, o.y + o.height / 2, '#222');
            obstacles.splice(i, 1);
            continue;
        }
        if (rectsOverlap(hb, o, 2)) {
            loseLife(o.id);
        }
        if (o.x + o.width < -40 || o.x > canvas.width + 40) obstacles.splice(i, 1);
    }

    for (let i = pits.length - 1; i >= 0; i--) {
        const pit = pits[i];
        pit.x -= gameSpeed;
        const pitBox = {
            x: pit.x,
            y: GROUND_Y - 8,
            width: pit.width,
            height: pit.height + 8
        };
        if (!sheep.isJumping && rectsOverlap(hb, pitBox, 0)) {
            loseLife(pit.id);
            burst(pit.x + pit.width / 2, GROUND_Y, '#8d6e63');
            deathPit = pit;
            pit.falling = true;
            continue;
        }
        if (pit.x + pit.width < -20) pits.splice(i, 1);
    }

    for (let i = hays.length - 1; i >= 0; i--) {
        const h = hays[i];
        h.x -= gameSpeed;
        const hayBox = { x: h.x - 8, y: h.y - 10, width: h.width + 16, height: h.height + 18 };
        if (rectsOverlap(hb, hayBox, 0)) {
            if (lives < MAX_LIVES) lives++;
            changeScore(HAY_POINTS);
            burst(h.x + 8, h.y, '#e6c35c');
            hays.splice(i, 1);
            continue;
        }
        if (h.x + h.width < -20) hays.splice(i, 1);
    }

    for (let i = paperScraps.length - 1; i >= 0; i--) {
        const scrap = paperScraps[i];
        scrap.x -= gameSpeed;
        const scrapBox = {
            x: scrap.x - 8,
            y: scrap.y - 10,
            width: scrap.width + 16,
            height: scrap.height + 18
        };
        if (rectsOverlap(hb, scrapBox, 0)) {
            loseLife(scrap.id);
            burst(scrap.x + 10, scrap.y, '#f1eee5');
            paperScraps.splice(i, 1);
            continue;
        }
        if (scrap.x + scrap.width < -20) paperScraps.splice(i, 1);
    }

    particles.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life--;
    });
    particles = particles.filter((p) => p.life > 0);
}

function drawWorldActors() {
    pits.forEach(drawPit);
    hays.forEach(drawHay);
    paperScraps.forEach(drawPaperScrap);
    obstacles.forEach((o) => {
        if (o.type === 'fence') drawFence(o);
        else drawCrow(o);
    });
    const blinking = gameState === 'PLAYING' && frame < invincibleUntil;
    drawSheep(sheep.x, sheep.y, { blink: blinking });
    particles.forEach((p) => {
        ctx.globalAlpha = Math.max(0, p.life / 28);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
        ctx.globalAlpha = 1;
    });
}

function updateGameOver() {
    gameOverAnim++;
    sheep.vy += 0.55;
    sheep.y += sheep.vy;
}

function drawFallenSheep() {
    const fallRotation = Math.min(Math.PI, gameOverAnim * 0.12);
    ctx.save();
    ctx.translate(sheep.x + sheep.width / 2, sheep.y + sheep.height / 2);
    ctx.rotate(fallRotation);
    ctx.translate(-sheep.width / 2, -sheep.height / 2);
    drawSheep(0, 0, { dead: true });
    ctx.restore();
}

function drawOrientationNotice() {
    if (!orientationNotice || window.innerWidth >= window.innerHeight) return;
    ctx.fillStyle = 'rgba(8, 15, 30, 0.82)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px sans-serif';
    ctx.fillText('Rotate your phone', canvas.width / 2, canvas.height / 2 - 12);
    ctx.font = '16px sans-serif';
    ctx.fillText('Landscape mode is recommended', canvas.width / 2, canvas.height / 2 + 20);
}

function drawClearScene() {
    clearAnim++;
    backgroundProgress += (1 - backgroundProgress) * 0.012;
    drawSky();
    drawBackground();
    const t = Math.min(1, clearAnim / 90);

    ctx.fillStyle = `rgba(255, 244, 196, ${0.15 + t * 0.55})`;
    ctx.beginPath();
    ctx.arc(680, 64, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(26, 39, 68, ${t})`;
    ctx.beginPath();
    ctx.arc(694, 54, 22, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 18; i++) {
        ctx.fillStyle = `rgba(255,255,255,${t * (0.35 + (i % 3) * 0.2)})`;
        ctx.beginPath();
        ctx.arc(40 + (i * 97) % 720, 24 + (i * 37) % 90, 1.2 + (i % 2), 0, Math.PI * 2);
        ctx.fill();
    }

    const walk = Math.min(1, clearAnim / 80);
    const sx = sheep.x + (310 - sheep.x) * walk;
    const sy = SHEEP_GROUND_Y;
    drawFuton(300, GROUND_Y - 20);

    if (walk < 1) {
        drawSheep(sx, sy, {});
    } else {
        const lie = Math.min(1, (clearAnim - 80) / 35);
        if (lie < 1) {
            ctx.save();
            ctx.translate(sx + 24, sy + 36);
            ctx.rotate(-1.15 * lie);
            ctx.translate(-(sx + 24), -(sy + 36));
            drawSheep(sx, sy, {});
            ctx.restore();
        } else {
            drawSheep(328, GROUND_Y - 50, { sleeping: true });
            drawZzz(clearAnim);
        }
    }

    if (clearAnim > 120) {
        if (score >= MAX_SCORE) drawAurora(clearAnim);
        ctx.fillStyle = '#fff8e1';
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('Good night, great run!', canvas.width / 2, 34);
        ctx.font = '16px sans-serif';
        ctx.fillText(
            `Score: ${score} (Target: ${MAX_SCORE})  Press Enter to play again`,
            canvas.width / 2,
            61
        );
        drawRanking();
    }
}

function loop() {
    if (gameState === 'CLEAR') {
        drawClearScene();
    } else {
        drawSky();
        drawBackground();
    }

    if (gameState === 'START') {
        drawSheep(sheep.x, sheep.y);
        drawHud();
        drawOverlay('Running Sheep', [
            '1: Press Enter or touch to jump',
            '2: Press Enter or touch again for a double jump',
            '3: You can stomp crows to defeat them',
            'Pass fences and pits, and collect hay'
        ]);
    } else if (gameState === 'PLAYING') {
        updatePlaying();
        drawWorldActors();
        drawHud();
    } else if (gameState === 'GAME_OVER') {
        drawSky();
        drawBackground();
        if (deathPit) drawPit(deathPit);
        updateGameOver();
        drawFallenSheep();
        if (gameOverAnim > 42) {
            drawOverlay('Game Over', [
                `Passed: ${passedObstacles} / ${CLEAR_GOAL}`,
                `Score: ${score} (Target: ${MAX_SCORE})`,
                'Press Enter to start again'
            ]);
        }
    }

    drawOrientationNotice();

    requestAnimationFrame(loop);
}

loop();
</script>
